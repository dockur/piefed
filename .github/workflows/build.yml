name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
    
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - 
        name: Retrieve latest tag
        run: |
          #!/bin/bash
          set -eu
          sudo apt install libxml2-utils
          latest_tag=$(curl -s https://codeberg.org/rimu/pyfedi/releases.rss | xmllint --xpath 'string(//item[1]/title)' -)
          latest_tag="${latest_tag:1}"
          echo "Found tag: v\"${latest_tag}\"" 
          major=${latest_tag:0:1}
          latest_version="${latest_tag:2}"
          minor="${latest_version%%.*}"
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV
          echo "latest_minor=$major.$minor" >> $GITHUB_ENV
          echo "latest_major=$major" >> $GITHUB_ENV
      - 
        name: Check if the tag exists locally
        uses: action-pack/tag-exists@v1
        id: checkTag
        with: 
          tag: 'v${{ env.latest_tag }}'         
      -
        name: Finish when found
        run: |
          #!/bin/bash
          val="${{ steps.checkTag.outputs.exists }}"
          echo "exists=${val}" >> $GITHUB_ENV
      -
        name: Download code
        if: env.exists == 'false'
        run:
          #!/bin/bash
          wget "https://codeberg.org/rimu/pyfedi/archive/v${{ env.latest_tag }}.zip"
          unzip "v${{ env.latest_tag }}.zip"
      - 
        name: Lint Dockerfile
        if: env.exists == 'false'
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: pyfedi/Dockerfile
          ignore: DL3003,DL3008,DL3059,DL3013,Dl3018
          failure-threshold: warning          
      -
        name: Docker metadata
        if: env.exists == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: |
            ${{ secrets.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,priority=100
            type=raw,value=${{ env.latest_major }},priority=350
            type=raw,value=${{ env.latest_minor }},priority=250
          labels: |
            org.opencontainers.image.title=${{ vars.NAME }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - 
        name: Set up Docker Buildx
        if: env.exists == 'false'
        uses: docker/setup-buildx-action@v3
      -
        name: Send mail
        if: env.exists == 'false'
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Actions <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: Build of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} completed
          body: |
              The build job of ${{ github.event.repository.name }} v${{ steps.meta.outputs.version }} was completed successfully! 
              
              See https://github.com/${{ github.repository }}/actions for more information.
