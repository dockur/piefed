<form method="post" action="{{ url_for('blocklist.blocklist_unsubscribe', actor=blocklist.link()) }}" class="d-inline"
      hx-post="{{ url_for('blocklist.blocklist_unsubscribe', actor=blocklist.link()) }}" hx-trigger="submit throttle:1s" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-warning btn-sm" aria-label="{{ _('Unsubscribe from %(name)s', name=blocklist.display_name()) }}">{{ _('Unsubscribe') }}</button>
</form>
