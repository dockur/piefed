<html>
<head>
    <script src="/static/js/scripts.js" nonce="{{ nonce }}"></script>
    <script nonce="{{ nonce }}">
        // Proof-of-work challenge.

        // Difficulty = required number of leading zero BITS in the digest.
        // Each extra bit doubles the expected work (~2^difficulty hashes).
        var DIFFICULTY_DESKTOP = {{ diff_desktop }};
        var DIFFICULTY_MOBILE = {{ diff_mobile }};

        function sha256(bytes) {
            function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
            var K = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a,
                h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;

            var len = bytes.length;
            var bitLen = len * 8;
            var withPad = len + 1;
            while (withPad % 64 !== 56) withPad++;
            var msg = new Uint8Array(withPad + 8);
            msg.set(bytes);
            msg[len] = 0x80;
            msg[msg.length - 4] = (bitLen >>> 24) & 0xff;
            msg[msg.length - 3] = (bitLen >>> 16) & 0xff;
            msg[msg.length - 2] = (bitLen >>> 8) & 0xff;
            msg[msg.length - 1] = bitLen & 0xff;

            var w = new Int32Array(64);
            for (var off = 0; off < msg.length; off += 64) {
                for (var i = 0; i < 16; i++) {
                    w[i] = (msg[off + i * 4] << 24) | (msg[off + i * 4 + 1] << 16) |
                           (msg[off + i * 4 + 2] << 8) | (msg[off + i * 4 + 3]);
                }
                for (i = 16; i < 64; i++) {
                    var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                    var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
                }
                var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                for (i = 0; i < 64; i++) {
                    var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
                    var ch = (e & f) ^ (~e & g);
                    var t1 = (h + S1 + ch + K[i] + w[i]) | 0;
                    var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
                    var maj = (a & b) ^ (a & c) ^ (b & c);
                    var t2 = (S0 + maj) | 0;
                    h = g; g = f; f = e; e = (d + t1) | 0;
                    d = c; c = b; b = a; a = (t1 + t2) | 0;
                }
                h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
                h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
            }
            var out = new Uint8Array(32);
            var hs = [h0, h1, h2, h3, h4, h5, h6, h7];
            for (i = 0; i < 8; i++) {
                out[i * 4] = (hs[i] >>> 24) & 0xff;
                out[i * 4 + 1] = (hs[i] >>> 16) & 0xff;
                out[i * 4 + 2] = (hs[i] >>> 8) & 0xff;
                out[i * 4 + 3] = hs[i] & 0xff;
            }
            return out;
        }

        function leadingZeroBits(bytes) {
            var count = 0;
            for (var i = 0; i < bytes.length; i++) {
                var b = bytes[i];
                if (b === 0) { count += 8; continue; }
                var mask = 0x80;
                while (mask && (b & mask) === 0) { count++; mask >>= 1; }
                break;
            }
            return count;
        }

        function encodeUtf8(str) {
            if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
            var bytes = [];
            for (var i = 0; i < str.length; i++) bytes.push(str.charCodeAt(i) & 0xff);
            return new Uint8Array(bytes);
        }

        function solveProofOfWork(difficulty) {
            // A random per-visit challenge so a solution can't be precomputed/shared.
            var challenge = String(Math.floor(Math.random() * 1e9)) + '.' +
                            String(new Date().getTime());
            var nonce = 0;
            while (true) {
                var digest = sha256(encodeUtf8(challenge + ':' + nonce));
                if (leadingZeroBits(digest) >= difficulty) {
                    return challenge + ':' + nonce;
                }
                nonce++;
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            var difficulty = isMobile() ? DIFFICULTY_MOBILE : DIFFICULTY_DESKTOP;
            setTimeout(function () {
                solveProofOfWork(difficulty);
                setCookie('anoobis', 'ok', 1000);
                location.href = '{{ next }}';
            }, 50);
        });
    </script>
</head>
<body bgcolor="black">
    <p style="color: white;" align="center">Loading, please wait...</p>
</body>
</html>
